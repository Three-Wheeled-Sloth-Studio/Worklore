name: Temporary source catalog refresh

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh catalog after removing temporary helper
        shell: pwsh
        run: |
          python -m pip install pyyaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-finish-alpha-slice.py
          git rm .github/workflows/tmp-refresh-source-catalog.yml
          python refs/tools/generate_source_catalog.py
          git add refs/implementation/sourceCatalog refs/implementation/.sourceCatalogShards
          git diff --cached --check
          git commit -m "Refresh WorkLore source catalog"
          git push origin HEAD:dev
