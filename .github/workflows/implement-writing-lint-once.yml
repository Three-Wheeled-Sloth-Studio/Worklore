# rerun with repository-proven bootstrap
name: One-shot deterministic writing linter implementation

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/apply_writing_lint_slice.py'
      - '.github/workflows/implement-writing-lint-once.yml'

permissions:
  contents: write

jobs:
  implement-writing-lint:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Keep build output outside checkout
        shell: pwsh
        run: |
          $frontendDist = Join-Path $env:RUNNER_TEMP "worklore-writing-lint-frontend"
          $cargoTarget = Join-Path $env:RUNNER_TEMP "worklore-writing-lint-cargo"
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $frontendDist | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTarget | Out-Null

      - name: Install validation dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyyaml

      - name: Bounded re-entry packet
        shell: pwsh
        run: python refs/tools/generate_agent_context.py --focus "WorkLore task-033 deterministic anti-slop writing pattern linter Writing Rules draft quality"

      - name: Apply deterministic writing linter slice
        shell: pwsh
        run: python .github/scripts/apply_writing_lint_slice.py

      - name: Remove one-shot scaffolding before validation
        shell: pwsh
        run: git rm -- .github/scripts/apply_writing_lint_slice.py .github/workflows/implement-writing-lint-once.yml

      - name: Format Rust implementation
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check

      - name: Run frontend tests
        shell: pwsh
        run: npm run test

      - name: Build frontend
        shell: pwsh
        run: npm run build:frontend

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          if (Test-Path src-tauri/Cargo.lock) { Remove-Item src-tauri/Cargo.lock -Force }
          if (Test-Path src-tauri/gen) { Remove-Item src-tauri/gen -Recurse -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic writing pattern linter"
          git push origin HEAD:dev
