name: One-shot deterministic writing linter implementation

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/apply_writing_lint_slice.py'
      - '.github/workflows/implement-writing-lint-once.yml'

permissions:
  contents: write

jobs:
  implement-writing-lint:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Keep build output outside checkout
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\worklore-target" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Bounded re-entry packet
        run: python refs/tools/generate_agent_context.py --focus "WorkLore task-033 deterministic anti-slop writing pattern linter Writing Rules draft quality"

      - name: Apply deterministic writing linter slice
        run: python .github/scripts/apply_writing_lint_slice.py

      - name: Remove one-shot scaffolding before validation
        shell: pwsh
        run: |
          git rm .github/scripts/apply_writing_lint_slice.py
          git rm .github/workflows/implement-writing-lint-once.yml

      - name: Format Rust implementation
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          git diff --check
          python refs/tools/validate_refs.py --mode initialized
          python refs/tools/generate_agent_context.py --check

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build:frontend

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic writing pattern linter"
          git push origin HEAD:dev
