name: Validate task-034 one-shot

on:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: task-034-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Initialize external validation folders
        shell: pwsh
        run: |
          $externalRoot = Join-Path $env:RUNNER_TEMP "WorkLore"
          $buildRoot = Join-Path $externalRoot "build\validate"
          $frontendDist = Join-Path $buildRoot "frontend"
          $cargoTarget = Join-Path $buildRoot "cargo-target"
          "WORKLORE_EXTERNAL_ROOT=$externalRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKLORE_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $frontendDist | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTarget | Out-Null
          ./scripts/assert-repo-clean.ps1

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Validate project references and diffs
        shell: pwsh
        run: |
          python -m pip install pyyaml
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          exit $LASTEXITCODE

      - name: Run frontend tests
        shell: pwsh
        run: npm run test

      - name: Build frontend externally
        shell: pwsh
        run: npm run build:frontend

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Run Rust tests externally
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints externally
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Verify repository remains source-only
        if: always()
        shell: pwsh
        run: ./scripts/assert-repo-clean.ps1
