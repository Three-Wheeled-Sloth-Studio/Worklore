name: One-shot provider voice closeout

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/closeout-provider-voice-once.yml

permissions:
  contents: write

jobs:
  closeout-provider-voice:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Keep build output outside checkout
        shell: pwsh
        run: |
          $frontendDist = Join-Path $env:RUNNER_TEMP "worklore-provider-closeout-frontend"
          $cargoTarget = Join-Path $env:RUNNER_TEMP "worklore-provider-closeout-cargo"
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $frontendDist | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTarget | Out-Null

      - name: Install validation dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyyaml

      - name: Apply documentation closeout
        shell: pwsh
        run: python .github/scripts/closeout_provider_voice_slice.py

      - name: Remove one-shot closeout scaffolding before validation
        shell: pwsh
        run: |
          git rm -- .github/scripts/closeout_provider_voice_slice.py .github/workflows/closeout-provider-voice-once.yml

      - name: Bounded re-entry packet
        shell: pwsh
        run: python refs/tools/generate_agent_context.py --focus "WorkLore task-033 deterministic anti-slop writing pattern linter Writing Rules draft quality"

      - name: Validate references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run frontend tests
        shell: pwsh
        run: npm run test

      - name: Build frontend
        shell: pwsh
        run: npm run build:frontend

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated clean closeout
        shell: pwsh
        run: |
          if (Test-Path src-tauri/Cargo.lock) { Remove-Item src-tauri/Cargo.lock -Force }
          if (Test-Path src-tauri/gen) { Remove-Item src-tauri/gen -Recurse -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- refs/architecture/providerArchitecture.md refs/planning/roadmap.yaml refs/planning/todos.yaml refs/handoffs/currentHandoff.md refs/handoffs/next-dev-prompt.md
          if (git diff --cached --quiet) { throw "Provider voice closeout produced no staged changes." }
          git commit -m "docs: close provider voice slice"
          git push origin HEAD:dev
