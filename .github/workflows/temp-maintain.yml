name: Temporary WorkLore Maintenance

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate maintained outputs
        shell: bash
        run: |
          python -m pip install pyyaml
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python refs/tools/generate_source_catalog.py
          git diff --check

      - name: Commit maintained outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No maintained outputs changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri refs/implementation
          git commit -m "Regenerate maintained outputs [maintenance]"
          git push origin HEAD:dev
