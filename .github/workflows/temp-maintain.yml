name: Temporary WorkLore Maintenance

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  maintain-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[maintenance]') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare external build folders
        shell: pwsh
        run: |
          $externalRoot = Join-Path $env:RUNNER_TEMP "WorkLore"
          $buildRoot = Join-Path $externalRoot "build\validate"
          $frontendDist = Join-Path $buildRoot "frontend"
          $cargoTarget = Join-Path $buildRoot "cargo-target"
          "WORKLORE_EXTERNAL_ROOT=$externalRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKLORE_BUILD_ROOT=$buildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $buildRoot,$frontendDist,$cargoTarget | Out-Null

      - name: Maintain generated outputs
        shell: pwsh
        run: |
          python -m pip install pyyaml
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          python refs/tools/generate_source_catalog.py
          git diff --check

      - name: Validate repository references
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/validate_refs.py --mode initialized
          python refs/tools/generate_agent_context.py --check

      - name: Validate frontend
        shell: pwsh
        run: |
          npm install
          npm run test
          npm run build:frontend

      - name: Validate Rust
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/assert-repo-clean.ps1

      - name: Commit maintained outputs
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host "No maintained outputs changed."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri refs/implementation
          git commit -m "Regenerate maintained outputs [maintenance]"
          git push origin HEAD:dev
