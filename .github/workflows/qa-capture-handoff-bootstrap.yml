name: Apply capture post handoff

on:
  pull_request:
    branches: [qa]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev'
    runs-on: windows-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install catalog dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Apply exact handoff patch
        shell: pwsh
        run: python refs/tools/qa_patch_capture_handoff.py

      - name: Regenerate bounded source catalog
        shell: pwsh
        run: python refs/tools/generate_source_catalog.py

      - name: Verify generated discovery
        shell: pwsh
        run: |
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/validate_refs.py --mode initialized
          python refs/tools/generate_agent_context.py --check

      - name: Commit handoff fix
        shell: pwsh
        run: |
          git config user.name "Three-Wheeled Sloth Automation"
          git config user.email "36046890+SlothMD@users.noreply.github.com"
          git add src refs/implementation/sourceCatalog refs/implementation/.sourceCatalogShards
          if (git diff --cached --quiet) {
            Write-Host "No handoff changes to commit."
            exit 0
          }
          git commit -m "fix: route generated posts from capture"
          git push origin HEAD:dev
