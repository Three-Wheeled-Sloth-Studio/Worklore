name: Format Rust

on:
  push:
    branches:
      - dev
    paths:
      - "src-tauri/**/*.rs"
      - "src-tauri/Cargo.toml"
      - "rustfmt.toml"
      - ".github/workflows/format-rust.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Apply Rust formatting')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust source is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Apply Rust formatting"
          git push origin HEAD:dev
