name: One-shot dev persistence validation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/validate-dev-persistence-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install refs validator dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Validate path safety and project memory
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison
