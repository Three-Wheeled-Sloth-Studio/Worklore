name: One-shot dev persistence validation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/validate-dev-persistence-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install refs validator dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Apply bounded lint fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          canonical = Path("src-tauri/src/services/canonical_store.rs")
          text = canonical.read_text(encoding="utf-8")
          names = [
              "pub struct StorySeedRecord",
              "pub struct CanonicalStoryRecord",
              "pub fn schema_version",
              "pub fn create_story_seed",
              "pub fn load_story_seed",
              "pub fn create_story",
              "pub fn load_story",
              "pub fn create_evidence",
              "pub fn create_inspiration",
              "pub fn create_target_context",
              "fn normalized_title",
          ]
          for name in names:
              needle = name
              replacement = "#[allow(dead_code)]\n" + name
              if replacement in text:
                  continue
              if text.count(needle) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {needle!r}")
              text = text.replace(needle, replacement, 1)
          canonical.write_text(text, encoding="utf-8")

          entity_scan = Path("src-tauri/src/services/entity_scan.rs")
          text = entity_scan.read_text(encoding="utf-8")
          before = '''    loop {
              let Some(first) = remaining.split_whitespace().next() else {
                  break;
              };
              if !LEADING_NOISE.contains(&first) {
                  break;
              }
              let advance = first.len();
              start += advance;
              remaining = &remaining[advance..];
              let whitespace = remaining.len() - remaining.trim_start().len();
              start += whitespace;
              remaining = remaining.trim_start();
          }
          '''
          after = '''    while let Some(first) = remaining.split_whitespace().next() {
              if !LEADING_NOISE.contains(&first) {
                  break;
              }
              let advance = first.len();
              start += advance;
              remaining = &remaining[advance..];
              let whitespace = remaining.len() - remaining.trim_start().len();
              start += whitespace;
              remaining = remaining.trim_start();
          }
          '''
          if after not in text:
              if text.count(before) != 1:
                  raise SystemExit("Expected the existing organization-noise loop exactly once")
              text = text.replace(before, after, 1)
          entity_scan.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Format Rust
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate path safety and project memory
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm formatted tree
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated Rust corrections
        shell: pwsh
        run: |
          git add src-tauri/Cargo.toml src-tauri/src
          if (-not (git diff --cached --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: finalize persistence validation"
            git push origin HEAD:dev
          }
