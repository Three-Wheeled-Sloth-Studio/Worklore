name: Apply post adherence QA fixes

on:
  pull_request:
    branches: [qa]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'dev'
    runs-on: windows-2025
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install catalog dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Apply exact QA patch
        shell: pwsh
        run: python refs/tools/qa_patch_20260916_post_adherence.py

      - name: Format Rust
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Regenerate bounded source catalog
        shell: pwsh
        run: python refs/tools/generate_source_catalog.py

      - name: Verify generated discovery and refs
        shell: pwsh
        run: |
          python refs/tools/generate_source_catalog.py --check
          python refs/tools/validate_refs.py --mode initialized
          python refs/tools/generate_agent_context.py --check

      - name: Commit remediation
        shell: pwsh
        run: |
          git config user.name "Three-Wheeled Sloth Automation"
          git config user.email "36046890+SlothMD@users.noreply.github.com"
          git add src src-tauri package.json refs/implementation
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "QA patch produced no changes" }
          git commit -m "fix: preserve Topic framing in generated posts"
          git push origin HEAD:dev
