name: Temporary alpha slice finisher

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference tooling dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Finish bounded alpha integration
        shell: pwsh
        run: |
          python scripts/tmp-finish-alpha-slice.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_source_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Remove temporary finisher and commit result
        shell: pwsh
        run: |
          git rm scripts/tmp-finish-alpha-slice.py .github/workflows/tmp-finish-alpha-slice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish WorkLore alpha branding and BYOK"
          git push origin HEAD:dev
