name: One-shot Target Context closeout validation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/implement-target-context-once.yml

permissions:
  contents: write

jobs:
  validate-closeout:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Keep build output outside checkout
        shell: pwsh
        run: |
          $frontendDist = Join-Path $env:RUNNER_TEMP "worklore-target-context-closeout-frontend"
          $cargoTarget = Join-Path $env:RUNNER_TEMP "worklore-target-context-closeout-cargo"
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $frontendDist | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTarget | Out-Null

      - name: Install validation dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyyaml

      - name: Bounded re-entry packet
        shell: pwsh
        run: python refs/tools/generate_agent_context.py --focus "WorkLore Target Context closeout Phase 1 task-041 application shell handoff"

      - name: Apply closeout documentation
        shell: pwsh
        run: python .github/scripts/fix_target_context_slice.py

      - name: Validate references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run frontend tests
        shell: pwsh
        run: npm run test

      - name: Build frontend
        shell: pwsh
        run: npm run build:frontend

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated closeout documentation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- refs/architecture/vaultFormat.md refs/planning/roadmap.yaml refs/handoffs/currentHandoff.md refs/handoffs/next-dev-prompt.md
          if (git diff --cached --quiet) { throw "Target Context closeout documentation produced no staged changes." }
          git commit -m "docs: close Target Context and hand off Phase 1 shell"
          git push origin HEAD:dev
