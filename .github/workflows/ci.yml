name: Validate WorkLore

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - dev
      - qa
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Create validation log folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path validation-logs | Out-Null

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm install 2>&1 | Tee-Object -FilePath validation-logs/npm-install.log
          exit $LASTEXITCODE

      - name: Validate project references
        shell: pwsh
        run: |
          python -m pip install pyyaml 2>&1 | Tee-Object -FilePath validation-logs/pip-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized 2>&1 | Tee-Object -FilePath validation-logs/refs-validation.log
          exit $LASTEXITCODE

      - name: Run frontend tests
        shell: pwsh
        run: |
          npm run test 2>&1 | Tee-Object -FilePath validation-logs/frontend-tests.log
          exit $LASTEXITCODE

      - name: Build frontend
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath validation-logs/frontend-build.log
          exit $LASTEXITCODE

      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check 2>&1 | Tee-Object -FilePath validation-logs/rust-format.log
          exit $LASTEXITCODE

      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath validation-logs/rust-tests.log
          exit $LASTEXITCODE

      - name: Run Rust lints
        shell: pwsh
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath validation-logs/rust-clippy.log
          exit $LASTEXITCODE

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-${{ github.run_id }}
          path: validation-logs
          if-no-files-found: ignore
          retention-days: 7
