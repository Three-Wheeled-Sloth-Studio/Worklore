# retry after provider audit test-call correction
name: One-shot provider voice analysis implementation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/implement-provider-voice-analysis-once.yml

permissions:
  contents: write

jobs:
  implement-provider-voice-analysis:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Keep build output outside checkout
        shell: pwsh
        run: |
          $frontendDist = Join-Path $env:RUNNER_TEMP "worklore-provider-voice-frontend"
          $cargoTarget = Join-Path $env:RUNNER_TEMP "worklore-provider-voice-cargo"
          "WORKLORE_FRONTEND_DIST=$frontendDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $frontendDist | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTarget | Out-Null

      - name: Install validation dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyyaml

      - name: Bounded re-entry packet
        shell: pwsh
        run: python refs/tools/generate_agent_context.py --focus "WorkLore Phase 2 provider registry Ollama structured voice analysis proposals Core Voice eligible Voice Evidence"

      - name: Apply bounded provider voice analysis slice
        shell: pwsh
        run: python .github/scripts/apply_provider_voice_analysis_slice.py

      - name: Apply provider voice analysis corrections
        shell: pwsh
        run: python .github/scripts/fix_provider_voice_analysis_slice.py

      - name: Apply provider voice analysis Clippy correction
        shell: pwsh
        run: python .github/scripts/fix_provider_voice_analysis_clippy.py

      - name: Format Rust changes
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Run frontend tests
        shell: pwsh
        run: npm run test

      - name: Build frontend
        shell: pwsh
        run: npm run build:frontend

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lints
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::manual-pattern-char-comparison

      - name: Confirm Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Commit validated provider voice analysis slice
        shell: pwsh
        run: |
          if (Test-Path src-tauri/Cargo.lock) { Remove-Item src-tauri/Cargo.lock -Force }
          if (Test-Path src-tauri/gen) { Remove-Item src-tauri/gen -Recurse -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/Cargo.toml src-tauri/src/domain/providers.rs src-tauri/src/error.rs src-tauri/src/services/app_preferences_service.rs src-tauri/src/services/voice_evidence_service.rs src-tauri/src/services/ollama_provider.rs src-tauri/src/services/provider_registry.rs src-tauri/src/services/voice_analysis_service.rs src-tauri/src/services/mod.rs src-tauri/src/commands/providers.rs src-tauri/src/lib.rs src/domain/types.ts src/lib/workloreApi.ts src/components/ProviderSettingsPanel.tsx src/provider-settings.css src/App.tsx src/components/VoiceWorkspace.tsx src/voice.css
          if (git diff --cached --quiet) { throw "Provider voice analysis slice produced no staged changes." }
          git commit -m "feat: add provider-neutral voice analysis"
          git push origin HEAD:dev
