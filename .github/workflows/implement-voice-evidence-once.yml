name: One-shot Voice Evidence closeout

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/implement-voice-evidence-once.yml

permissions:
  contents: write

jobs:
  closeout-voice-evidence:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install refs validation dependency
        shell: pwsh
        run: python -m pip install pyyaml

      - name: Reconcile task-031 documentation
        shell: pwsh
        run: python .github/scripts/fix_voice_evidence_slice.py

      - name: Remove one-shot implementation infrastructure
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply_voice_evidence_slice.py -Force
          Remove-Item .github/scripts/fix_voice_evidence_slice.py -Force
          Remove-Item .github/workflows/implement-voice-evidence-once.yml -Force

      - name: Guard bounded closeout diff
        shell: pwsh
        run: |
          $allowed = @(
            '.github/scripts/apply_voice_evidence_slice.py',
            '.github/scripts/fix_voice_evidence_slice.py',
            '.github/workflows/implement-voice-evidence-once.yml',
            'refs/architecture/vaultFormat.md',
            'refs/handoffs/currentHandoff.md',
            'refs/handoffs/next-dev-prompt.md',
            'refs/planning/roadmap.yaml',
            'refs/planning/todos.yaml'
          )
          $changed = @(git diff --name-only)
          foreach ($path in $changed) {
            if ($allowed -notcontains $path) {
              throw "Unexpected closeout change: $path"
            }
          }
          if ($changed.Count -ne $allowed.Count) {
            Write-Host "Changed paths:" ($changed -join ', ')
            throw "Closeout diff did not contain the expected bounded path set."
          }

      - name: Validate closeout references and path safety
        shell: pwsh
        run: |
          python scripts/check-case-collisions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/validate_refs.py --mode initialized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_agent_context.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Commit bounded task-031 closeout
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/scripts/apply_voice_evidence_slice.py .github/scripts/fix_voice_evidence_slice.py .github/workflows/implement-voice-evidence-once.yml refs/architecture/vaultFormat.md refs/handoffs/currentHandoff.md refs/handoffs/next-dev-prompt.md refs/planning/roadmap.yaml refs/planning/todos.yaml
          if (git diff --cached --quiet) { throw "Task-031 closeout produced no staged changes." }
          git commit -m "docs: close task-031 and hand off Core Voice foundation"
          git push origin HEAD:dev
