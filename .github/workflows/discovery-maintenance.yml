name: Refresh discovery candidate

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and regenerate catalog
        shell: bash
        run: |
          python -m pip install pyyaml
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add src-tauri src package.json
          python refs/tools/generate_source_catalog.py
          git add refs/implementation/sourceCatalog refs/implementation/.sourceCatalogShards
          git rm .github/workflows/discovery-maintenance.yml
          git config user.name "Three-Wheeled Sloth"
          git config user.email "36046890+SlothMD@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format discovery slice and refresh source catalog"
          git push origin HEAD:dev
