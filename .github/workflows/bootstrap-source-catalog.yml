name: Bootstrap Source Catalog

on:
  pull_request:
    branches:
      - qa
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - name: Install catalog dependency
        shell: pwsh
        run: python -m pip install pyyaml
      - name: Generate source catalog
        shell: pwsh
        run: python .github/bootstrap_generate_source_catalog.py
      - name: Commit generated catalog
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs/implementation/sourceCatalog refs/implementation/.sourceCatalogShards
          if (git diff --cached --quiet) {
            Write-Host "Catalog already current."
            exit 0
          }
          git commit -m "docs: bootstrap generated source catalog"
          git push origin HEAD:dev
