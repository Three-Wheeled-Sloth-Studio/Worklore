name: Refresh Agent Discovery Artifacts

on:
  pull_request:
    branches:
      - qa
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - name: Install generator dependency
        shell: pwsh
        run: python -m pip install pyyaml
      - name: Refresh generated discovery
        shell: pwsh
        run: |
          python refs/tools/generate_source_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python refs/tools/generate_okf_indexes.py
          exit $LASTEXITCODE
      - name: Commit generated discovery
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refs
          if (git diff --cached --quiet) {
            Write-Host "Generated discovery already current."
            exit 0
          }
          git commit -m "docs: refresh generated agent discovery"
          git push origin HEAD:dev
