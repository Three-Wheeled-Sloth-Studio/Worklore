version: 2
schema: refs/schemas/schemaRegistry.yaml
updated: 2026-09-12
instructions:
  - For routine continuation or after a context reset, start with `python refs/tools/generate_agent_context.py --focus "<short task phrase>"`; treat its output as derived orientation, never as a replacement source of truth.
  - Load context progressively. Start from the generated packet and its file-map hints, then read deeper roadmap, architecture, history, or source material only when the task crosses those boundaries or the compact evidence is insufficient.
  - On first project bootstrap, or when authoritative identity is required, read refs/project.yaml.
  - Read only the relevant roadmap, todo, and accepted-decision records before changing implementation work; do not reread full planning history merely because a conversation reset occurred.
  - Read relevant files under refs/architecture before changing system boundaries or module ownership.
  - Read refs/implementation/fileMap.yaml before searching broadly.
  - Prefer diff-first continuation from the accepted checkpoint over reconstructing unchanged repository state.
  - Treat accepted decisions as inputs unless new runtime, test, or user evidence contradicts them.
  - Conserve coding-agent context and tokens deliberately; prefer targeted file ranges, symbol/search results, deterministic diagnostics, and tests over broad whole-file or whole-repository reads.
  - If substantially the same diagnostic, search, comparison, or transformation is performed twice, make it a reusable script, helper, or test before doing it a third time unless the operation is genuinely one-off.
  - Read refs/testing/validationCommands.yaml before finalizing changes.
  - Use refs/index.md as the OKF discovery surface, but do not substitute it for authoritative structured state.
  - Keep durable decisions, todos, handoffs, implementation notes, and validation results in refs.
  - Keep the active handoff delta-oriented: accepted baseline, what landed, current evidence or gap, next slice, relevant files, do-not-reopen constraints, and validation.
  - Preserve OKF frontmatter on new or migrated Markdown concepts under refs; legacy exceptions are explicitly listed in refs/okfProfile.yaml and should shrink when those documents are materially edited.
  - Do not hand-edit generated index.md files; regenerate them with refs/tools/generate_okf_indexes.py.
  - Never infer OKF verified status from generation, passing tests, Git history, or refs validation.
  - Do not store secrets, real vault contents, resumes, provider logs, entity mappings, or machine-local credentials in the repository.
  - Record unknown facts in refs/planning/openQuestions.yaml instead of guessing.
  - Record durable product and architecture decisions in refs/planning/decisions.yaml.
  - Update refs/handoffs/currentHandoff.md when stopping with incomplete or context-heavy work.
  - Keep machine-local paths only in files that explicitly allow machine-local configuration.
  - Preserve refs file paths unless a migration note explains the change.
  - Never create, rename, or retain two tracked paths that differ only by letter casing.
  - Treat the Git index, not a filesystem directory scan, as the authority for case-collision checks; the normal validation path must fail when distinct tracked paths share the same case-folded full path.
  - Match import and reference casing exactly to the tracked path. Use semantic suffixes such as Model, State, View, Adapter, Schema, or Utils rather than distinguishing files only by capitalization.
  - Perform case-only renames through a temporary intermediate filename, then verify the Git diff and run the case-collision guard.
  - Keep the public README user-facing. It should cover the user job, implemented major features, and installation only.
  - Reference Three-Wheeled-Sloth-Studio/TWS-Design-Principles instead of copying shared principles into this repository.
  - Use only standard US keyboard punctuation in generated user-facing copy.
